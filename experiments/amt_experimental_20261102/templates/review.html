<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf }}"><title>新版・実験衝突レビュー</title><link rel="stylesheet" href="assets/review.css"><script src="assets/review.js" defer></script></head>
<body><header><a href="/">HDCD · 報告書</a><a href="export.csv">判定CSVを保存</a></header>
<main><h1>実験衝突レビュー</h1><p class="intro">各系列の上位80件 · 全14系列で1,120件。再構成画像と軌跡を確認して判定します。旧版の判定は表示しません。</p>
<section class="panel"><p id="processing" role="status">処理状況を確認しています…</p><label for="scene">系列</label><select id="scene"></select><p id="progress"></p><progress id="bar" value="0" max="1120"></progress><p id="waiting">処理と画像作成が完了した系列からレビューできます。</p></section>
<section id="workspace" hidden><div class="navigation"><button id="previous">← 前</button><select id="candidate" aria-label="候補を選択"></select><button id="next">次 →</button></div>
<h2 id="title"></h2><p id="meta" class="muted"></p><div class="views"><figure><img id="movie" alt="候補時刻の前後を再構成した粒子画像"><figcaption>黄色：消失側A、青：継続側B。枠が黄色の画像は候補時刻。表示は −10～+20フレーム。</figcaption></figure><section class="panel"><div class="plot-controls"><label for="projection">軌跡</label><select id="projection"><option value="xy">XY面</option><option value="xz">XZ面</option><option value="yz">YZ面</option></select></div><canvas id="trajectory" width="600" height="460" aria-label="候補の前後の粒子軌跡"></canvas><p class="muted">各軸の実座標範囲を表示しています。単位：mm。</p></section></div>
<section class="panel judgment"><h2>判定</h2><p id="current-label">未判定</p><label for="note">メモ（任意）</label><textarea id="note" rows="2"></textarea><div class="actions"><button data-label="collision" class="positive">衝突・合体</button><button data-label="non_collision">非衝突</button><button data-label="ambiguous">判定困難</button></div><label class="check"><input id="advance" type="checkbox" checked>保存後に次の候補へ</label><p id="feedback" role="status" aria-live="polite">判定はこの版の候補と画像に対応付けて保存します。</p></section></section>
</main></body></html>
