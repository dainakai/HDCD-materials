[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ra3d"
version = "1.0.1"
description = "Reproducible relation-attention detection and review of 3D particle collisions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/ra3d/config/physics/LICENSE-SCALE.txt"]
authors = [{name = "Dai Nakai"}]
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<4", "scipy>=1.13,<2",
  "scikit-learn==1.7.1", "torch>=2.5,<3", "pillow>=10,<13",
  "pyarrow>=18", "pyyaml>=6", "huggingface-hub>=1.0,<2",
  "flask>=3.1,<4", "threadpoolctl>=3", "zstandard>=0.23", "skops>=0.14,<1", "safetensors>=0.5",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12", "build>=1.2"]
docs = ["mkdocs-material>=9.6"]

[project.scripts]
collision = "ra3d.cli:main"
collision-2d = "ra3d.baseline2d:main"
collision-minip = "ra3d.minip:main"
collision-physics = "ra3d.physics:main"
ra3d = "ra3d.cli:main"

[project.urls]
Repository = "https://github.com/dainakai/HDCD-materials"
Documentation = "https://github.com/dainakai/HDCD-materials#readme"
Issues = "https://github.com/dainakai/HDCD-materials/issues"
Archive = "https://doi.org/10.5281/zenodo.23409588"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ra3d = ["config/*.json", "config/simulation/*.csv", "config/physics/*", "simulation/provenance.json", "_core/*provenance.json", "templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: verifies published or original scientific assets", "gpu: requires a CUDA device"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
